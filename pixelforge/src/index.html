<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pixelforge — Free Design Studio for Logos, Social Posts &amp; Presentations</title>
  <meta name="description" content="Pixelforge is a free, open-source Canva alternative. Design logos, social media graphics, presentations, photo edits and more — with AI background removal, smart crop, brand kits, and a real-time editor that runs in the browser.">
  <meta name="keywords" content="design studio, canva alternative, free design tool, logo maker, social media graphics, brand kit, ai background removal, online photo editor, presentation maker">
  <meta name="author" content="Pixelforge">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="theme-color" content="#7c3aed">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0c29">
  <meta name="color-scheme" content="dark light">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">

  <!-- iOS / mobile PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pixelforge">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">

  <!-- Favicons (multi-size set generated by favicon.io) -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192x192.png">
  <link rel="mask-icon" href="logo.png" color="#7c3aed">

  <!-- Open Graph (Facebook, LinkedIn, generic crawlers) -->
  <meta property="og:title" content="Pixelforge — Free Design Studio">
  <meta property="og:description" content="Free, open-source Canva alternative. Design logos, social posts, presentations and more — with AI background removal and a real-time browser-based editor.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Pixelforge">
  <meta property="og:locale" content="en_US">
  <meta property="og:image" content="logo.png">
  <meta property="og:image:width" content="500">
  <meta property="og:image:height" content="500">
  <meta property="og:image:alt" content="Pixelforge logo — purple pixel grid with a cyan lightning bolt">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Pixelforge — Free Design Studio">
  <meta name="twitter:description" content="Free, open-source Canva alternative. AI background removal, smart crop, brand kits — all in your browser.">
  <meta name="twitter:image" content="logo.png">
  <meta name="twitter:image:alt" content="Pixelforge logo">

  <!-- Structured data (JSON-LD) for the application itself -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Pixelforge",
    "description": "Free, open-source Canva alternative. Design logos, social media graphics, presentations, photo edits and more.",
    "applicationCategory": "DesignApplication",
    "operatingSystem": "Web",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "image": "logo.png"
  }
  </script>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    /* Splash / loading screen */
    .pf-splash {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 99999;
      transition: opacity 0.4s;
    }
    .pf-splash-logo {
      width: 96px; height: 96px;
      object-fit: contain;
      filter: drop-shadow(0 10px 30px rgba(124,58,237,0.45));
      animation: pf-splash-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes pf-splash-pop {
      0%   { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1);   opacity: 1; }
    }
    .pf-splash-text {
      margin-top: 18px;
      color: #d4d4d8;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      letter-spacing: 0.3px;
    }
    .pf-splash-spinner {
      margin-top: 24px;
      width: 24px; height: 24px;
      border: 2.5px solid rgba(255,255,255,0.15);
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: pfspin 0.8s linear infinite;
    }
    @keyframes pfspin { to { transform: rotate(360deg); } }
    .pf-fade-out { opacity: 0; pointer-events: none; }

    /* Disable iOS bounce/overscroll */
    html, body {
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* Safe area for notches */
    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
  </style>
</head>
<body>
  <div class="pf-splash" id="pfSplash">
    <img class="pf-splash-logo" src="logo.png" alt="Pixelforge" />
    <div class="pf-splash-text">Loading Pixelforge...</div>
    <div class="pf-splash-spinner"></div>
  </div>

  <app-root></app-root>

  <noscript>Please enable JavaScript to continue using this application.</noscript>

  <script>
    // Hide splash once Angular has rendered the root
    window.addEventListener('load', function() {
      var check = setInterval(function() {
        var root = document.querySelector('app-root');
        if (root && root.children.length > 0) {
          clearInterval(check);
          var splash = document.getElementById('pfSplash');
          if (splash) {
            splash.classList.add('pf-fade-out');
            setTimeout(function() { splash.remove(); }, 400);
          }
        }
      }, 80);
      // Hard timeout: hide after 5s no matter what
      setTimeout(function() {
        var splash = document.getElementById('pfSplash');
        if (splash) splash.remove();
      }, 5000);
    });
  </script>
</body>
</html>
